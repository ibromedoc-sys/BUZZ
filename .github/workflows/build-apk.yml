name: Build VENTE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "setuptools<70"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "kivy==2.3.0" "kivymd==2.0.0"
       

      - name: Clean everything
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Configure the ANDROID_KEYSTORE_BASE64 GitHub Actions secret."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/vente-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/vente-signing/release.keystore"
          test -s "$RUNNER_TEMP/vente-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/vente-signing/release.keystore"
    
      - name: Vérifier Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"
      - name: Build APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/vente-signing/release.keystore
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$P4A_RELEASE_KEYALIAS" || {
            echo "::error::Configure the ANDROID_KEY_ALIAS GitHub Actions secret."
            exit 1
          }
          test -n "$P4A_RELEASE_KEYSTORE_PASSWD" || {
            echo "::error::Configure the ANDROID_KEYSTORE_PASSWORD GitHub Actions secret."
            exit 1
          }
          test -n "$P4A_RELEASE_KEYALIAS_PASSWD" || {
            echo "::error::Configure the ANDROID_KEY_PASSWORD GitHub Actions secret."
            exit 1
          }
          buildozer -v android release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VENTE-APK-RELEASE
          path: bin/*-release.apk
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/vente-signing"